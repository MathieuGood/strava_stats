name: 🚀 Deploy to VPS

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      cd ~/apps/strava_stats
                      git pull origin main
                      if [ ! -f backend/.env ]; then
                          printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\nACCESS_TOKEN=%s\nREFRESH_TOKEN=%s\nEXPIRES_AT=%s\n' \
                              '${{ secrets.STRAVA_CLIENT_ID }}' \
                              '${{ secrets.STRAVA_CLIENT_SECRET }}' \
                              '${{ secrets.STRAVA_ACCESS_TOKEN }}' \
                              '${{ secrets.STRAVA_REFRESH_TOKEN }}' \
                              '${{ secrets.STRAVA_EXPIRES_AT }}' \
                              > backend/.env
                      fi
                      if [ ! -f backend/activities.json ]; then
                          echo '[]' > backend/activities.json
                      fi
                      docker compose -f docker-compose.prod.yml up -d --build
